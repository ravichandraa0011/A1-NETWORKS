{% extends 'network/base.html' %}
{% block title %}Add Project | A1 Networks{% endblock %}

{% block content %}
<div class="container-narrow" style="margin-top: var(--space-10); margin-bottom: var(--space-12);">
    <div class="glass-card static" style="padding: var(--space-10);">
        <div style="text-align: center; margin-bottom: var(--space-10);">
            <h1 style="font-size: var(--text-3xl); margin-bottom: var(--space-2);">Add a Portfolio Project</h1>
            <p style="color: var(--text-tertiary); font-size: var(--text-base);">Showcase your work to the community.</p>
        </div>

        <form method="POST" style="display: flex; flex-direction: column; gap: var(--space-6);">
            {% csrf_token %}

            {{ form.as_p }}

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-6); padding-top: var(--space-6); border-top: 1px solid var(--border);">
                <a href="{% url 'network:profile' user.username %}" style="color: var(--text-tertiary); font-weight: 600; font-size: var(--text-sm);">Cancel</a>
                <button type="submit" class="glass-btn" style="padding: 12px 32px;">Publish Project</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
